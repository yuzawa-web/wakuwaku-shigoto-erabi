<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>わくわく仕事えらび</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* ロゴの三角形（赤・紺・グレー）を「紙吹雪」と「名札」に使う。1画面1問のカード式 */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --fg:#1A2233; --muted:#5D6678;
  --navy:#0B3D6B; --navy-soft:#E2EAF3; --red:#BF3A2B; --red-soft:#FBE9E6; --grey:#8F8F8F;
  --line:#D8DEE8; --ok:#2E7A4B; --ok-soft:#E1F0E6; --on-navy:#FFFFFF; --paper:#FFFFFF;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#172030; --fg:#E8ECF3; --muted:#A4ADBE;
  --navy:#8DB4DE; --navy-soft:#1F2D44; --red:#EE7466; --red-soft:#3A2220; --grey:#9A9A9A;
  --line:#2B3850; --ok:#7CCB9A; --ok-soft:#1C3427; --on-navy:#0E1420; --paper:#F4F2EE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#172030; --fg:#E8ECF3; --muted:#A4ADBE;
  --navy:#8DB4DE; --navy-soft:#1F2D44; --red:#EE7466; --red-soft:#3A2220; --grey:#9A9A9A;
  --line:#2B3850; --ok:#7CCB9A; --ok-soft:#1C3427; --on-navy:#0E1420; --paper:#F4F2EE; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.75;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px;position:relative;z-index:1}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
img{display:block}

/* 背景にうすく散らした三角 */
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco i{position:absolute;width:var(--s);height:var(--s);background:var(--c);opacity:.13;clip-path:polygon(0 0,100% 0,100% 100%)}

.logo{display:inline-flex;align-self:flex-start;background:#fff;border-radius:999px;padding:8px 16px;box-shadow:0 1px 0 var(--line)}
.logo img{height:26px;width:auto}

/* スタート画面 */
.hero{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.hero h1{font-size:clamp(40px,12vw,60px);font-weight:900;color:var(--navy);letter-spacing:.02em;line-height:1.1}
.hero h1 .w{color:var(--red);display:inline-block}
.hero h1 .w span{display:inline-block;animation:hop 2.4s ease-in-out infinite}
.hero h1 .w span:nth-child(2){animation-delay:.12s}.hero h1 .w span:nth-child(3){animation-delay:.24s}.hero h1 .w span:nth-child(4){animation-delay:.36s}
@keyframes hop{0%,70%,100%{transform:none}80%{transform:translateY(-8px)}}
.stamp{display:inline-block;font-family:var(--display);font-weight:900;font-size:14px;color:#fff;background:var(--red);padding:4px 12px;border-radius:6px;transform:rotate(-3deg);align-self:flex-start}
.lead{font-size:17px}
.photos{position:relative;aspect-ratio:10/8.8;margin:4px 0 6px}
.pol{position:absolute;width:56%;background:var(--paper);padding:7px 7px 26px;border-radius:4px;box-shadow:0 6px 18px rgba(10,30,60,.18);transform:rotate(var(--r))}
.pol img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:2px}
.pol b{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-family:var(--display);font-size:13px;color:#33393f;font-weight:700}
.pol:nth-child(1){left:0;top:12px;--r:-5deg}
.pol:nth-child(2){right:0;top:0;--r:4deg}
.pol:nth-child(3){left:24%;top:38%;--r:-1.5deg;z-index:2}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;padding:4px 12px;border-radius:999px;background:var(--navy-soft);color:var(--navy);font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.btn{font-family:var(--display);font-weight:700;font-size:18px;border-radius:16px;padding:16px 20px;border:2px solid var(--navy);cursor:pointer;transition:transform .12s ease;text-align:center;text-decoration:none;display:block;width:100%}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.btn.primary{background:var(--navy);color:var(--on-navy)}
.btn.go{background:var(--red);border-color:var(--red);color:#fff;font-size:22px;padding:18px;box-shadow:0 5px 0 color-mix(in srgb,var(--red) 60%,#000)}
.btn.go:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--red) 60%,#000)}
.btn.ghost{background:var(--surface);color:var(--navy)}
.small{font-size:13px;color:var(--muted)}

/* 質問 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.track{position:relative;height:14px;border-radius:99px;background:var(--navy-soft)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--navy);transition:width .35s ease}
.track .runner{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;background:var(--red);clip-path:polygon(0 0,100% 0,50% 100%);transition:left .35s ease}
.qcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:30px 22px 22px;display:flex;flex-direction:column;gap:18px;overflow:hidden}
.qcard::before{content:"";position:absolute;right:0;top:0;width:70px;height:70px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 100%);opacity:.9}
.qcard::after{content:"";position:absolute;right:0;top:0;width:36px;height:36px;background:var(--navy);clip-path:polygon(0 0,100% 0,100% 100%)}
.qno{font-family:var(--display);font-weight:900;font-size:44px;line-height:1;color:var(--navy)}
.qno small{font-size:16px;color:var(--muted);margin-left:6px;font-weight:700}
.section-label{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--red)}
.q{font-family:var(--display);font-size:clamp(22px,6.2vw,28px);font-weight:700;min-height:3.4em;display:flex;align-items:center}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answers .btn{font-size:24px;padding:22px 8px}
.answers .yes{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--red) 60%,#000)}
.answers .no{background:var(--surface);color:var(--navy);box-shadow:0 5px 0 var(--navy-soft)}
.answers .btn:active{transform:translateY(4px);box-shadow:none}
.back{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;align-self:flex-start;padding:4px 0;font-family:var(--body)}
.back:disabled{visibility:hidden}
.pop{animation:pop .3s ease}
@keyframes pop{from{opacity:.3;transform:translateX(18px) rotate(1deg)}to{opacity:1;transform:none}}

/* 結果：名札 */
.result-head{text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.result-head .section-label{font-size:14px}
.badge{position:relative;background:var(--surface);border:2px solid var(--navy);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.badge .clip{position:absolute;top:10px;left:50%;width:60px;height:10px;margin-left:-30px;border-radius:10px;background:var(--bg);border:2px solid var(--navy);z-index:3}
.badge .pic{position:relative;aspect-ratio:16/9;background:var(--navy-soft)}
.badge .pic img{width:100%;height:100%;object-fit:cover}
.badge .pic .cap{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.mark{position:absolute;inset:0;display:grid;place-items:center}
.mark div{position:relative;width:120px;height:120px}
.mark i{position:absolute;width:50%;height:50%}
.mark .t1{left:0;top:0;background:var(--red);clip-path:polygon(0 0,100% 0,100% 100%)}
.mark .t2{right:0;top:0;background:var(--navy);clip-path:polygon(0 0,100% 0,0 100%)}
.mark .t3{left:25%;top:50%;background:var(--grey);clip-path:polygon(0 0,100% 0,0 100%)}
.badge .body{padding:20px 22px 26px;display:flex;flex-direction:column;gap:12px}
.badge .body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--red) 0 50%,var(--navy) 50% 100%)}
.badge h2{font-size:clamp(28px,8vw,36px);font-weight:900;color:var(--navy);text-align:center}
.badge .job{font-family:var(--display);font-weight:700;font-size:18px;text-align:center}
.badge .tags{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.match{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:10px;border-radius:99px;background:var(--navy-soft);overflow:hidden}
.bar span{display:block;height:100%;background:var(--red);border-radius:99px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:0}
.dl dt{font-weight:700;color:var(--navy);white-space:nowrap}
.dl dd{margin:0;min-width:0}
.why{background:var(--navy-soft);border-radius:12px;padding:12px 14px;font-size:15px}
.why b{color:var(--navy)}
.why ul{margin:6px 0 0;padding-left:1.2em}
.sub{display:flex;flex-direction:column;gap:12px}
.mini{display:grid;grid-template-columns:96px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;align-items:start}
.mini .thumb{position:relative;width:96px;height:96px;border-radius:12px;overflow:hidden;background:var(--navy-soft)}
.mini .thumb img{width:100%;height:100%;object-fit:cover}
.mini .thumb .mark div{width:56px;height:56px}
.mini > div:last-child{min-width:0;display:flex;flex-direction:column;gap:4px}
.mini .rank{font-size:12px;font-weight:700;color:var(--red);letter-spacing:.06em}
.mini h3{font-size:19px;color:var(--navy)}
.mini .job{font-weight:700;font-size:14px}
.cta{position:relative;overflow:hidden;background:var(--navy);color:var(--on-navy);border-radius:22px;padding:26px 22px;display:flex;flex-direction:column;gap:14px}
.cta::after{content:"";position:absolute;right:-10px;bottom:-10px;width:90px;height:90px;background:var(--red);clip-path:polygon(100% 0,100% 100%,0 100%);opacity:.9}
.cta h3{font-size:23px}
.cta p,.cta .btn{position:relative;z-index:1}
.cta .btn{background:#fff;border-color:#fff;color:#0B3D6B}
.notice{border:2px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:14px;background:var(--surface)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row .btn{font-size:15px;padding:12px 8px}
details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
summary{cursor:pointer;font-family:var(--display);font-weight:700;color:var(--navy)}
.all{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:10px}
.all li{border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.all li b{font-family:var(--display);color:var(--navy);font-size:15px}

/* 紙吹雪 */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.confetti i{position:absolute;top:-30px;width:14px;height:14px;background:var(--c);clip-path:polygon(0 0,100% 0,50% 100%);animation:fall var(--d) ease-in forwards;animation-delay:var(--dl)}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--rot))}}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .hero h1 .w span,.pop,.fade{animation:none}.confetti{display:none}
  .track .fill,.track .runner{transition:none}}
</style>
</head>

<script>

/* 共通の質問：「はい」と答えたときに点数が入るお仕事 */

/* ─────────────────────────────────────────── */

const app = document.getElementById("app");
let steps, idx, answers;

(function deco(){
  const cols=["var(--red)","var(--navy)","var(--grey)"], d=document.getElementById("deco");
  const spots=[[4,8,46],[86,14,30],[78,46,54],[6,62,34],[90,82,40],[30,92,26]];
  d.innerHTML = spots.map((p,i)=>`<i style="left:${p[0]}%;top:${p[1]}%;--s:${p[2]}px;--c:${cols[i%3]};transform:rotate(${i*37}deg)"></i>`).join("");
})();

function buildSteps(){
  steps = QUESTIONS.map((q,i)=>({kind:"q",i,t:q.t}));
  steps.push({kind:"gate",t:LIC_GATE.t});
  if(answers.gate===true) LIC_QS.forEach((q,i)=>steps.push({kind:"lic",i,t:q.t}));
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const mark = `<div class="mark" aria-hidden="true"><div><i class="t1"></i><i class="t2"></i><i class="t3"></i></div></div>`;
const logo = `<span class="logo"><img src="${IMG.logo}" alt="博滇会 HAKUSHINKAI"></span>`;

function start(){
  app.innerHTML = `
  ${logo}
  <section class="hero fade">
    <span class="stamp">15タイプ診断</span>
    <h1><span class="w"><span>わ</span><span>く</span><span>わ</span><span>く</span></span><br>仕事えらび</h1>
    <div class="photos" aria-hidden="true">
      <figure class="pol" style="margin:0"><img src="${IMG.driver}" alt=""><b>送迎</b></figure>
      <figure class="pol" style="margin:0"><img src="${IMG.fureai}" alt="" style="object-position:50% 70%"><b>ふれあい</b></figure>
      <figure class="pol" style="margin:0"><img src="${IMG.mamiya}" alt=""></figure>
    </div>
    <p class="lead">「はい」「いいえ」で答えるだけ。博滇会の15のお仕事から、あなたにぴったりのタイプを見つけます。</p>
    <div class="meta">
      <span class="chip">約3分</span><span class="chip">はい・いいえだけ</span><span class="chip ok">資格がなくてもOK</span>
    </div>
    <button class="btn go" id="go">さっそく はじめる</button>
    <p class="small">介護・看護・リハビリ・保育・栄養・調理・送迎・事務・地域連携。いろいろな形で、地域の暮らしを支えています。</p>
  </section>
  ${allList()}`;
  document.getElementById("go").onclick = ()=>{answers={q:{},gate:null,lic:{}};idx=0;buildSteps();ask();};
}

function ask(){
  const s = steps[idx];
  const total = steps.length + (answers.gate===null ? LIC_QS.length : 0);
  const pct = Math.round(idx/total*100);
  const label = s.kind==="q" ? "あなたのこと" : "さいごに、資格のこと";
  app.innerHTML = `
  <div class="top">${logo}<span class="small">わくわく仕事えらび</span></div>
  <div class="track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:${pct}%"></div><div class="runner" style="left:${Math.max(3,pct)}%"></div></div>
  <section class="qcard pop">
    <div class="qno">Q.${idx+1}<small>${label}</small></div>
    <p class="q">${esc(s.t)}</p>
    <div class="answers">
      <button class="btn yes" id="yes">はい</button>
      <button class="btn no" id="no">いいえ</button>
    </div>
    <button class="back" id="back" ${idx===0?"disabled":""}>← ひとつ前にもどる</button>
  </section>`;
  document.getElementById("yes").onclick=()=>answer(true);
  document.getElementById("no").onclick=()=>answer(false);
  document.getElementById("back").onclick=()=>{ if(idx>0){ idx--; if(steps[idx].kind==="gate"){answers.lic={};} ask(); } };
}

function answer(v){
  const s = steps[idx];
  if(s.kind==="q") answers.q[s.i]=v;
  else if(s.kind==="gate"){ answers.gate=v; answers.lic={}; buildSteps(); }
  else answers.lic[s.i]=v;
  idx++;
  if(idx>=steps.length) result(); else ask();
}

function score(){
  const sc={}, max={}, why={};
  Object.keys(TYPES).forEach(k=>{sc[k]=0;max[k]=0;why[k]=[];});
  QUESTIONS.forEach((q,i)=>{
    Object.entries(q.w).forEach(([k,p])=>{ max[k]+=p; if(answers.q[i]){ sc[k]+=p; why[k].push({t:q.t,p}); } });
  });
  const open = new Set(Object.keys(TYPES).filter(k=>TYPES[k].free || k==="houmonkaigo"));
  LIC_QS.forEach((q,i)=>{ if(answers.lic[i]){ q.opens.forEach(k=>open.add(k)); Object.entries(q.bonus||{}).forEach(([k,p])=>sc[k]+=p); } });
  return Object.keys(TYPES).filter(k=>open.has(k)).map(k=>{
    const ratio = max[k] ? Math.min(1, sc[k]/max[k]) : 0;
    // 並べる順番：質問の多いお仕事が不利にならないように調整し、PRIORITY をかける
    const rank = (sc[k] / Math.pow(max[k]||1, 0.8)) * (PRIORITY[k]||1);
    return {k, ratio, raw:sc[k], rank, why:why[k].sort((a,b)=>b.p-a.p).slice(0,3)};
  }).sort((a,b)=> b.rank-a.rank || b.raw-a.raw);
}
function pctOf(r){ return Math.max(35, Math.round(55 + r.ratio*45)); }
function pic(k){ const p=PHOTOS[k]; return p ? `<img src="${p.src}" alt="${esc(p.cap)}" loading="lazy" style="object-position:${p.pos||"50% 50%"}">` : mark; }

function confetti(){
  const c=document.createElement("div"); c.className="confetti"; c.setAttribute("aria-hidden","true");
  const cols=["var(--red)","var(--navy)","var(--grey)"];
  let h=""; for(let i=0;i<36;i++){ h+=`<i style="left:${Math.random()*100}%;--c:${cols[i%3]};--d:${(1.8+Math.random()*1.6).toFixed(2)}s;--dl:${(Math.random()*.5).toFixed(2)}s;--rot:${Math.round(Math.random()*720-360)}deg"></i>`; }
  c.innerHTML=h; document.body.appendChild(c); setTimeout(()=>c.remove(),4200);
}

function result(){
  let list = score();
  const allNo = Object.values(answers.q).every(v=>!v);
  if(allNo){ list = ["driver","jimu","chouri","dayreha"].map(k=>({k,ratio:.4,raw:0,why:[]})); }
  const [top,...rest] = list; const t = TYPES[top.k];
  const noLic = answers.gate===false;
  const lic = (x)=> TYPES[x].free ? `<span class="chip ok">${esc(TYPES[x].lic)}</span>` : `<span class="chip">資格：${esc(TYPES[x].lic)}</span>`;
  const shareText = `わくわく仕事えらびの結果：わたしは「${t.name}」（${t.job}）でした！`;
  const ph = PHOTOS[top.k];

  app.innerHTML = `
  ${logo}
  <div class="result-head fade"><p class="section-label">診断結果</p><h3>あなたにいちばん合うのは…</h3></div>
  <article class="badge fade">
    <span class="clip" aria-hidden="true"></span>
    <div class="pic">${pic(top.k)}${ph?`<span class="cap">${esc(ph.cap)}</span>`:""}</div>
    <div class="body">
      <h2>${esc(t.name)}</h2>
      <p class="job">${esc(t.job)}</p>
      <div class="tags">${lic(top.k)}</div>
      <div class="match"><span>相性</span><div class="bar"><span style="width:${pctOf(top)}%"></span></div><span>${pctOf(top)}%</span></div>
      <p>${esc(t.desc)}</p>
      ${top.why.length?`<div class="why"><b>あなたの答えから</b><ul>${top.why.map(w=>`<li>${esc(w.t.replace(/？$/,""))} → はい</li>`).join("")}</ul></div>`:""}
      <dl class="dl"><dt>働ける場所</dt><dd>${esc(t.place)}</dd></dl>
    </div>
  </article>

  <section class="sub">
    <p class="section-label">こちらも向いています</p>
    ${rest.slice(0,2).map((r,i)=>`
      <div class="mini">
        <div class="thumb">${pic(r.k)}</div>
        <div>
          <span class="rank">${i+2}位　相性 ${pctOf(r)}%</span>
          <h3>${esc(TYPES[r.k].name)}</h3>
          <p class="job">${esc(TYPES[r.k].job)}</p>
          <div>${lic(r.k)}</div>
          <p class="small">${esc(TYPES[r.k].desc)}</p>
        </div>
      </div>`).join("")}
  </section>

  ${noLic?`<div class="notice"><b>資格がなくても始められるお仕事</b><br>介護スタッフ（デイリハ・趣味活動・入所）、調理スタッフ、送迎ドライバー、事務スタッフ、地域連携スタッフ。訪問介護員は「介護職員初任者研修」を取ると始められます。</div>`:""}

  <section class="cta">
    <h3>まずは見学してみませんか？</h3>
    <p>実際の職場の雰囲気を見てから決められます。「${esc(t.job)}」の見学をご案内します。</p>
    ${VISIT_URL?`<a class="btn" href="${esc(VISIT_URL)}" target="_blank" rel="noopener">見学を予約する</a>`:`<button class="btn" id="visit">見学を予約する</button><p class="small" id="visitmsg" hidden style="color:var(--on-navy)">見学予約のページは準備中です。ここに予約ページへのリンクが入ります。</p>`}
  </section>

  <div class="row">
    <button class="btn ghost" id="again">もう一度やる</button>
    <button class="btn ghost" id="copy">結果をコピー</button>
  </div>
  ${allList()}`;

  const v=document.getElementById("visit"); if(v) v.onclick=()=>{document.getElementById("visitmsg").hidden=false;};
  document.getElementById("again").onclick=start;
  const c=document.getElementById("copy");
  c.onclick=()=>{
    const done=()=>{c.textContent="コピーしました";setTimeout(()=>c.textContent="結果をコピー",1800)};
    try{ navigator.clipboard.writeText(shareText).then(done).catch(()=>{c.textContent="コピーできませんでした"}); }
    catch(e){ c.textContent="コピーできませんでした"; }
  };
  window.scrollTo({top:0});
  confetti();
}

function allList(){
  return `<details><summary>博滇会のお仕事 全${Object.keys(TYPES).length}タイプを見る</summary>
  <ul class="all">${Object.values(TYPES).map(t=>`<li><b>${esc(t.name)}</b><br>${esc(t.job)}　<span class="small">${esc(t.lic)}</span></li>`).join("")}</ul></details>`;
}

start();
